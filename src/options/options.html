<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web AI Assistant · Settings</title>
    <link rel="stylesheet" href="../content/panel.css" />
    <style>
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: var(--ap-bg-mute);
        color: var(--ap-text);
      }
      .options__intro {
        max-width: 720px;
        margin: 0 auto 16px;
        font-size: 13.6px;
        line-height: 1.7;
        color: var(--ap-text-soft);
      }
      .options__intro h1 {
        margin: 0 0 6.4px;
        font-size: 17.6px;
        font-weight: 700;
        color: var(--ap-text);
      }
      #app {
        max-width: 720px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body class="apweb-scope">
    <div class="options__intro">
      <h1 data-i18n="optionsTitle">Web AI Assistant</h1>
      <p data-i18n="optionsIntro">
        These settings apply to the whole browser. Requests go straight from the browser to the
        endpoint you enter. The key is kept only in this browser (browser.storage.local) and never
        goes through a relay.
      </p>
    </div>
    <div id="app"></div>

    <script src="../../vendor/marked.umd.js"></script>
    <script src="../../vendor/purify.min.js"></script>
    <script src="../../vendor/katex.min.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/ai.js"></script>
    <script src="../shared/math.js"></script>
    <script src="../shared/markdown.js"></script>
    <script src="../shared/store.js"></script>
    <script src="../content/panel.js"></script>
    <script src="options.js"></script>
  </body>
</html>
